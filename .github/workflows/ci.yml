name: CI

# Every push and pull request: lint, type-check, curriculum integrity
# and a production build. No secrets needed: the database and password
# are only read at runtime.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, checks & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (ESLint + React Compiler rules)
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Curriculum integrity (DSA + System Design)
        run: npm run check:data

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'data/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
